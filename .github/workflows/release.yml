name: Release Build

# Manual, and only after CI is green. Producing an installable build is a
# deliberate act, not something every push should trigger.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # Fail early with a clear message rather than deep inside the EAS CLI.
      - name: Check EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a token at"
            echo "::error::https://expo.dev/settings/access-tokens and add it under"
            echo "::error::Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # --------------------------------------------------------------------------
  # Static checks. Fast, no services — fails the PR before anything expensive.
  # --------------------------------------------------------------------------
  quality:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # This is not a formality. Type checking in this project was silently
      # inert for its whole history (a malformed hand-written Database type
      # plus a TypeScript version too old for react-query's NoInfer), so every
      # query result was `any`. Keeping tsc green in CI is what stops that
      # from quietly happening again.
      - name: Type check
        run: npm run typecheck

  # --------------------------------------------------------------------------
  # Database: apply every migration from scratch, seed, then run the security
  # regression suite. This is the job that would have caught the three
  # privilege-escalation holes.
  # --------------------------------------------------------------------------
  database:
    name: Migrations & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # `db reset` replays every migration in order against a clean Postgres
      # and then runs seed.sql — so a migration that only works incrementally,
      # or a seed that drifted from the schema, fails here rather than on
      # someone's machine.
      - name: Start Supabase and apply migrations
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - name: Reset database (migrations + seed)
        run: supabase db reset

      - name: Security regression suite
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/security.sql

      # Types are generated from the schema. If someone adds a migration and
      # forgets to regenerate, the committed types are stale and the app is
      # type-checking against a schema that no longer exists.
      - name: Check committed DB types are up to date
        run: |
          # Drops trailing blank lines and CRs so formatting noise can't fail
          # the build — only real schema drift should.
          normalize() {
            sed 's/\r$//' "$1" | awk 'NF {p=NR} {a[NR]=$0} END {for(i=1;i<=p;i++) print a[i]}'
          }

          supabase gen types typescript --local > /tmp/fresh.raw
          # The committed file is: header + verbatim generated block + aliases.
          # Extract just the generated block and diff it against a fresh run.
          sed -n '/^\/\/ >>> GENERATED START/,/^\/\/ <<< GENERATED END/p' \
            types/database.types.ts \
            | sed '1,3d' | sed '$d' > /tmp/committed.raw

          normalize /tmp/fresh.raw    > /tmp/fresh.ts
          normalize /tmp/committed.raw > /tmp/committed.ts

          if ! diff -u /tmp/committed.ts /tmp/fresh.ts > /tmp/types.diff; then
            echo "::error::types/database.types.ts is stale. Run 'npm run db:types' and re-paste the generated block."
            head -60 /tmp/types.diff
            exit 1
          fi
          echo "Committed DB types match the schema."

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # --------------------------------------------------------------------------
  # Does the app actually bundle for a device? Catches import errors, bad
  # native module usage, and Metro/Babel config breakage that tsc can't see.
  # --------------------------------------------------------------------------
  bundle:
    name: Bundle (Android + iOS)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Placeholders: the bundle only needs these to exist so the Supabase
      # client constructor doesn't throw at import time. No real credentials.
      - name: Export bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}
          retention-days: 7

  # --------------------------------------------------------------------------
  # Dependency health. Non-blocking: advisories in transitive Expo deps are
  # common and shouldn't wedge the pipeline, but they should be visible.
  # --------------------------------------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      # Expo pins specific versions per SDK. Drifting off them is how this
      # project ended up on react-query 5.101 with TypeScript 5.3.
      - name: Expo dependency compatibility
        run: npx expo install --check
